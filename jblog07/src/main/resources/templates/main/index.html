<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<title>JBlog</title>
	<link rel="stylesheet" th:href="@{/css/jblog.css}">
</head>
<body>
	<div class="center-content">
		<th:block th:insert="~{includes/header}" />
		<ul class="menu">
			<div sec:authorize="!isAuthenticated()">
				<li><a th:href="@{/user/join}">회원가입</a></li>
				<li><a th:href="@{/user/login}">로그인</a></li>
			</div>
			<div sec:authorize="isAuthenticated()">
				<!-- 
				#authentication
				- Spring Security의 Authentication 객체 접근
				
				Thymeleaf URL 표현식
				- @{/{var}(var=${expression})} 형태로 변수 치환
				- ${} 직접 연결은 표현식을 문자열로 인코딩해버림!
				 -->
				<li><a th:href="@{/{blogId}(blogId=${#authentication.principal.blogId})}">나의 블로그</a></li>
				<li><a th:href="@{/user/logout}">로그아웃</a></li>
			</div>
		</ul>
		<form class="search-form">
			<fieldset>
				<input type="text" name="keyword" /> 
				<input type="submit" value="검색" />
			</fieldset>
			<fieldset>
				<input type="radio" name="which" value="blog-title"> <label>블로그 제목</label>
				<input type="radio" name="which" value="tag"> <label>태그</label>
				<input type="radio" name="which" value="blog-user"> <label>블로거</label>
			</fieldset>
		</form>
	</div>
</body>
</html>
