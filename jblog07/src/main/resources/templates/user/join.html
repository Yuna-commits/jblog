<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>JBlog</title>
<link rel="stylesheet" th:href="@{/css/jblog.css}">
<link id="contextPathHolder" th:data-contextPath="${@environment.getProperty('server.servlet.context-path')}">
<script th:src="@{/js/jquery/jquery-1.9.0.js}"></script>
<script type="text/javascript">
	const contextPath = $("#contextPathHolder").attr("data-contextPath");
	// 아이디 중복 체크
	$(function() {
		// id = "btn-check" 클릭 시
		$("#btn-check").click(function() {
			
			$("#blogId").focus();
			var blogId = $("#blogId").val();
			
			if(!blogId) {
				alert("아이디를 입력해 주세요.");
				$("#blogId").focus();
				return;
			}
			
			$.ajax({
				// url : /jblog07/api/users/exists?blogId=...
				url: contextPath + "/api/users/exists?blogId=" + encodeURIComponent(blogId),
				type: "GET",
				dataType: "json",
				success: function(response) {
					// 통신 성공 && data == true
					if(response.data) {
						alert("이미 존재하는 아이디입니다. 다른 아이디를 입력해 주세요.");
						$("#blogId").val("");
						$("#blogId").focus();
						$("#img-check").hide();
						$("#btn-check").show();
						return;
					}
					// 사용 가능한 아이디
					alert("사용 가능한 아이디입니다.");
					$("#img-check").show();
					$("#btn-check").hide();
				},
				error: function(xhr, status, err) {
					console.error("Ajax 오류: ", err);
					alert("서버와 통신 중 오류가 발생했습니다.");
				}
			});
		});
	});
</script>
</head>

<body>
	<div class="center-content">
		<th:block th:insert="~{includes/header}" />
		<form class="join-form" id="join-form" th:object="${userVo}"
			method="post" th:action="@{/user/join}">

			<label class="block-label" for="name"></label> 
			<input id="name" name="name" type="text" th:field="*{name}" placeholder="이름">
			<!-- 유효성 검사 실패 오류 메시지 -->
			<div class="error" th:if="${#fields.hasErrors('name')}" 
				th:errors="*{name}"></div>

			<label class="block-label" for="blogId"></label> 
			<input id="blogId" name="blogId" type="text" th:field="*{blogId}" placeholder="아이디">
			<!-- 유효성 검사 실패 오류 메시지 -->
			<div class="error" th:if="${#fields.hasErrors('blogId')}" 
				th:errors="*{blogId}"></div>
			<!-- 아이디 중복 확인 -->
			<input id="btn-check" type="button" value="id 중복체크"> 
			<img id="img-check" style="display: none;" th:src="@{/images/check.png}">
			
			<label class="block-label" for="password"></label>
			<input id="password" name="password" type="password" th:field="*{password}" placeholder="비밀번호">
			<!-- 유효성 검사 실패 오류 메시지 -->
			<div class="error" th:if="${#fields.hasErrors('password')}" 
				th:errors="*{password}"></div>

			<fieldset>
				<legend>약관동의</legend>
				<input id="agree-prov" type="checkbox" name="agreeProv" value="y">
				<label class="l-float">서비스 약관에 동의합니다.</label>
			</fieldset>

			<input type="submit" value="가입하기">

		</form>
		
		<ul class="menu">
			<li><a th:href="@{/}">메인으로</a></li>
			<li><a th:href="@{/user/login}">로그인 하기</a></li>			
		</ul>
	</div>
</body>
